name: Application CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check Docker tools
        run: |
          docker version
          docker compose version

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build backend image
        run: docker compose build backend

      - name: Check Python syntax
        run: |
          docker compose run --rm --no-deps backend \
            python -c "import ast; from pathlib import Path; ast.parse(Path('app.py').read_text()); print('Python syntax OK')"

      - name: Start application
        run: docker compose up -d --wait --wait-timeout 90

      - name: Check HTTP responses
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
            --retry 5 --retry-connrefused --retry-delay 1 \
            --connect-timeout 2 --max-time 5 \
            http://localhost/health

          check_response() {
            local path="$1"
            local expected_status="$2"
            local expected_body="$3"
            local actual_status

            actual_status=$(curl --silent --show-error \
              --connect-timeout 2 --max-time 5 \
              --output /tmp/response.txt \
              --write-out '%{http_code}' \
              "http://localhost${path}")

            echo "${path}: expected ${expected_status}, got ${actual_status}"
            test "$actual_status" = "$expected_status"
            printf '%s\n' "$expected_body" | diff - /tmp/response.txt
          }

          check_response "/" "200" "Hello from Effective Mobile!"
          check_response "/health" "200" "ok"
          check_response "/nonexistent" "404" "Not found"

      - name: Show container status and logs
        if: always()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=100

      - name: Clean up
        if: always()
        run: docker compose down --volumes --remove-orphans
